name: wizctl_app
description: Control Philips WiZ lights on your local network.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  bloc: ^9.2.1
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_soloud: ^5.0.2
  go_router: ^18.0.1
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_drawing: ^1.0.1
  uuid: ^4.6.0
  wizctl:
    path: ../wizctl

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  drift_dev: ^2.34.6
  build_runner: ^2.16.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    # The three open licences the app ships and registers at start, so the
    # standard licence page lists them (see `lib/app/bootstrap.dart`).
    - assets/fonts/OFL-BigShouldersDisplay.txt
    - assets/fonts/OFL-HankenGrotesk.txt
    - assets/fonts/OFL-JetBrainsMono.txt
  fonts:
    # The display face. Static instances of Google Fonts'
    # `BigShouldersDisplay[wght].ttf` at the four weights the kit sets.
    - family: BigShouldersDisplay
      fonts:
        - asset: assets/fonts/BigShouldersDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BigShouldersDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/BigShouldersDisplay-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BigShouldersDisplay-Black.ttf
          weight: 900
    # The hero's face, at the one weight the hero uses.
    - family: NeumaticCompressed
      fonts:
        - asset: assets/fonts/NeumaticCompressed-ExtraBold.otf
          weight: 800
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
